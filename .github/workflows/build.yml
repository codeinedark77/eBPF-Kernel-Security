name: CI/CD Build Pipeline (Project OMNI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-ebpf-probes:
    name: Build eBPF Kernel Probes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Clang & LLVM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Compile eBPF Object
        run: |
          cd modules/ebpf_kernel
          clang -O2 -target bpf -g -D__TARGET_ARCH_arm64 -I/usr/include/aarch64-linux-gnu -c bpf_probe.c -o bpf_probe.o

      - name: Upload eBPF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-probes
          path: modules/ebpf_kernel/bpf_probe.o

  build-go-backend:
    name: Build DriftNet Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build DriftNetd
        run: |
          cd modules/driftnet
          GOOS=linux GOARCH=arm64 go build -o driftnetd ./cmd/driftnetd

      - name: Upload Go Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driftnet-daemon
          path: modules/driftnet/driftnetd

  build-nextjs-dashboard:
    name: Build DriftNet Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Dashboard
        run: |
          cd modules/driftnet/frontend
          npm install
          npm run build

      - name: Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: driftnet-frontend
          path: modules/driftnet/frontend/out
